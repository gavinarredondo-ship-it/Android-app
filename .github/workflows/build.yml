name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NSP-Box-Android.zip
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer "cython<3" virtualenv
      - name: Build
        working-directory: NSP-Box-Android
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: NSP-Box-apk
          path: NSP-Box-Android/bin/*.apk
